<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Personal Finance Tracker</h1>
    <p>Enter your monthly income and expenses below.</p>

    <input type="number" id="income" placeholder="Monthly Income">
    <input type="number" id="rent" placeholder="Rent / Housing">
    <input type="number" id="food" placeholder="Food">
    <input type="number" id="transport" placeholder="Transportation">
    <input type="number" id="phone" placeholder="Phone / Internet">
    <input type="number" id="other" placeholder="Other Expenses">

    <button onclick="calculateBudget()">Calculate Budget</button>

    <div class="result" id="result">
      <h2>Your Results</h2>
      <p>Total Expenses: $0</p>
      <p>Remaining Balance: $0</p>
      <p>Savings Rate: 0%</p>
    </div>

    <p class="footer">Deployed on Azure VM using Terraform and GitHub Actions</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
